# ============================================================
# DLRM Temporal: SMALL TEST (quick validation only)
# ============================================================
# Validates the temporal_window selection pipeline in seconds.
# Use dlrm_temporal.yaml for primary benchmarking (5 GB, >1M offsets).

model:
  name: test_dlrm_temporal

dataset:
  data_folder: data/dlio/test_dlrm_temporal
  format: indexed_binary
  num_files_train: 8
  num_samples_per_file: 4096
  record_dims: [160]     # 160 B/sample (real Criteo record size)

reader:
  batch_size: 128
  sample_shuffle: off
  file_shuffle: off

train:
  epochs: 1
  computation_time: 0.064

selection:
  mode: temporal_window
  window_fraction: 0.58
  within_keep_rate: 0.30
  seed: 42
  # Total: 8×4096 = 32,768 samples × 160 B = 5.1 MB
  # Accessed: 32768×0.174 ≈ 5,702 offsets

benchmark:
  queue_depth: 128
  o_direct: true
  n_runs: 1
  report_prefix: "results/dlio/test_dlrm_temporal"
