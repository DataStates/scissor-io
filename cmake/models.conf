# scissor/models.conf
#
# Default regression model parameters for scissor's Regressor.
# Values are calibrated on Polaris (ALCF) with Lustre PFS, NVMe SSD,
# and a hybrid configuration.  Override by pointing SCISSOR_MODEL_CONFIG
# to a site-specific file, or place a per-user config at
# ${HOME}/.scissor/models.conf.
#
# Format: simple INI.  Sections are [name].  Keys are key = value.
# Lines beginning with # are comments.  Blank lines are ignored.
# Comma-separated float arrays are used for io_params and gaps.
#
# io_params: [C, alpha, beta, gamma, delta] for the throughput model:
#   throughput = C * N^alpha * exp(-beta*N) * S^gamma * exp(-delta*S)
# where N = number of IOPs and S = segment size in bytes.
#
# compute_model: log-linear regression of compute time vs bytes per core:
#   time = exp(intercept + slope * log(bytes_per_core))

[compute]
slope     = 0.748
intercept = -17.0366

[pfs]
# Calibrated on Polaris Lustre stripe-1 configuration.
io_params = 4.29e+00, -3.33e-02, 7.26e-06, 4.54e-01, 1.37e-01
gaps      = 0, 1, 2, 4, 8, 16

[ssd]
# Calibrated on Polaris local NVMe (/local/scratch).
io_params = 1.13e+01, -5.58e-03, 1.82e-05, 1.64e-01, 7.48e-02
gaps      = 0, 1, 2, 4, 8, 16

[hybrid]
# Calibrated on a mixed PFS + burst buffer topology.
io_params = 4.26e+00, -3.47e-02, 4.35e-06, 3.86e-01, -2.72e-02
gaps      = 0, 1, 2, 4, 8, 16
